<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger · Graduate Admission Resume</title>
<style>
:root{--theme:#1B3A5E;--line:#D8E1EC;}
*{box-sizing:border-box;}
body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#222;}
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #dde3ea;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.toolbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;color:#33475e;font-family:inherit;}
.toolbar button:hover{border-color:var(--theme);color:var(--theme);}
.toolbar .tpl-btn.active{background:var(--theme);color:#fff;border-color:var(--theme);}
.toolbar .act-btn.primary{background:var(--theme);color:#fff;border-color:var(--theme);}
.toolbar .act-btn.primary:hover{color:#fff;opacity:.92;}
.toolbar .spacer{flex:1;}
.wrap{max-width:820px;margin:20px auto 60px;padding:0 16px;}
.sheet{background:#fff;border-radius:6px;box-shadow:0 4px 18px rgba(20,40,70,.10);padding:40px 46px;}
[contenteditable]{outline:none;border-radius:3px;}
[contenteditable]:focus{background:#f2f7ff;box-shadow:0 0 0 2px #bcd4ef;}
h1.name{font-size:26px;margin:0 0 8px;color:var(--theme);text-align:center;letter-spacing:2px;font-weight:700;}
.contact,.apply{text-align:center;font-size:12.5px;margin:2px 0;}
.contact{color:#666;}
.apply{color:var(--theme);font-weight:600;}
.head-rule{border:0;border-top:2px solid var(--theme);margin:12px 0 4px;}
.summary{font-size:13.5px;line-height:1.8;text-indent:2em;margin:10px 0 4px;color:#333;}
.sec-title{font-size:14.5px;color:var(--theme);font-weight:700;border-bottom:1.5px solid var(--theme);padding-bottom:3px;margin:16px 0 6px;}
.exp-head{display:flex;gap:8px;align-items:baseline;margin:6px 0 2px;flex-wrap:wrap;}
.eh-left{font-weight:700;font-size:13.5px;}
.eh-tag{color:#5a6a7c;font-size:12.5px;}
.eh-tag:not(:empty)::before{content:"| ";}
.eh-right{margin-left:auto;color:#7a8698;font-size:12px;}
ul.points{margin:2px 0 4px;padding-left:18px;}
ul.points li{font-size:13.5px;line-height:1.75;margin:2px 0;color:#333;}
.points b{color:var(--theme);}
/* Tech Blue Template */
.sheet.tech{padding:0;overflow:hidden;}
.tech-flex{display:flex;}
.tech-side{width:212px;background:var(--theme);color:#fff;padding:30px 20px;flex:none;}
.tech-side h1.name{color:#fff;font-size:22px;text-align:left;margin-bottom:12px;letter-spacing:1px;}
.tech-side .contact,.tech-side .apply{color:#cddcee;text-align:left;font-size:11.5px;font-weight:400;}
.tech-side .sec-title{color:#fff;border-color:rgba(255,255,255,.42);font-size:13px;margin:18px 0 6px;}
.tech-side ul.points{padding-left:15px;}
.tech-side ul.points li{color:#dbe7f4;font-size:11.5px;line-height:1.6;}
.tech-side .points b{color:#fff;}
.tech-main{flex:1;padding:30px 32px;min-width:0;}
/* Minimal Template */
.sheet.minimal{box-shadow:none;border-radius:0;border:1px solid #e8e8e8;padding:44px 50px;}
.sheet.minimal h1.name{font-weight:300;font-size:31px;color:#1a1a1a;letter-spacing:4px;}
.sheet.minimal .apply{color:#555;font-weight:500;}
.sheet.minimal .head-rule{border-top:1px solid #dcdcdc;}
.sheet.minimal .sec-title{color:#555;border-bottom:1px solid #e2e2e2;}
.sheet.minimal .points b{color:#333;}
.hint{max-width:820px;margin:0 auto 18px;padding:0 16px;color:#8a94a2;font-size:12px;}
@media print{
  body{background:#fff;}
  .toolbar,.hint{display:none;}
  .wrap{max-width:none;margin:0;padding:0;}
  .sheet{box-shadow:none;border-radius:0;border:0;padding:0;}
  [contenteditable]:focus{background:none;box-shadow:none;}
}
</style>
</head>
<body>
<div class="toolbar">
  <button class="tpl-btn active" data-tpl="classic" onclick="switchTpl('classic')">Classic</button>
  <button class="tpl-btn" data-tpl="tech" onclick="switchTpl('tech')">Tech Blue</button>
  <button class="tpl-btn" data-tpl="minimal" onclick="switchTpl('minimal')">Minimal</button>
  <span class="spacer"></span>
  <button class="act-btn primary" onclick="downloadDocx()">Download Word (.docx)</button>
  <button class="act-btn primary" onclick="downloadPdf()">Download PDF</button>
  <button class="act-btn" onclick="copyText()">Copy Text</button>
  <button class="act-btn" onclick="window.print()">Print</button>
</div>
<div class="hint">Click anywhere in the resume to edit directly; switching templates will not lose your changes.</div>
<div class="wrap"><div id="resume" class="sheet"></div></div>
<script>
// Resume content (English)
const resumeData = {
  name: "Tiger",
  contact: "Phone: [To be filled] | Email: [To be filled] | Location: Zhengzhou, Henan",
  applyFor: "Let the world see me",
  summary: "Prospective graduate student with solid foundation in computer vision, deep learning, and full-stack development. Hands-on research experience in target detection model optimization and ancient character recognition systems, with strong engineering implementation skills and academic research potential.",
  sections: [
    {
      title: "Education Background",
      items: [
        {
          left: "Undergraduate Institution",
          tag: "Bachelor of Engineering in Computer Science and Technology",
          right: "[Enrollment - Graduation Date]",
          points: [
            "Core Courses: Advanced Mathematics, Linear Algebra, Probability and Statistics, Data Structures, Algorithms, Computer Organization, Operating Systems, Computer Networks, Machine Learning, Deep Learning, Computer Vision",
            "Academic Standing: Solid professional foundation, strong mathematical and programming skills, excellent academic performance",
            "English Proficiency: Good English reading and writing skills, able to smoothly read English academic papers and technical documentation"
          ]
        }
      ]
    },
    {
      title: "Research & Project Experience",
      items: [
        {
          left: "Ancient Character Recognition System Based on Deep Learning",
          tag: "Core Developer",
          right: "[Start - End Date]",
          points: [
            "Responsible for dataset construction and preprocessing: sorted and annotated <b>12,000+</b> ancient character images, completed data augmentation and format standardization",
            "Optimized target detection model based on <b>YOLOv8</b>: improved feature extraction module and loss function, increased character recognition accuracy from <b>82%</b> to <b>94.7%</b>",
            "Designed and implemented full-stack system: built web application with React frontend and Flask backend, supported image upload, real-time recognition and result export functions",
            "Project outcome: completed system development and testing, recognized by supervisor, laid foundation for subsequent research on minority character digitization"
          ]
        },
        {
          left: "Campus Smart Security Monitoring Platform",
          tag: "Technical Lead",
          right: "[Start - End Date]",
          points: [
            "Led team of 4 to design and implement campus security monitoring system with real-time abnormal behavior detection function",
            "Integrated pedestrian detection and tracking algorithm: optimized model inference speed, reduced edge device response latency by <b>32%</b>, met real-time monitoring requirements",
            "Built backend service architecture: implemented high-concurrency video stream processing and data storage based on Spring Boot and MySQL, supported multi-camera access",
            "Project achievement: won second prize in university student innovation competition, applied for software copyright"
          ]
        }
      ]
    },
    {
      title: "Technical Skills",
      items: [
        {
          left: "Programming Languages",
          points: ["Proficient in Python, familiar with C/C++, Java, JavaScript; good coding style and engineering practice habits"]
        },
        {
          left: "AI & Deep Learning",
          points: ["Proficient in PyTorch framework, familiar with YOLO series, CNN, Transformer and other classic models, experienced in model training, optimization and deployment"]
        },
        {
          left: "Full-stack Development",
          points: ["Master React/Vue frontend frameworks, familiar with Flask/Spring Boot backend development, understand MySQL, Redis database design and optimization"]
        },
        {
          left: "Tools & Others",
          points: ["Proficient in Git, Docker, Linux operating system, familiar with OpenCV image processing, have certain scientific research paper writing ability"]
        }
      ]
    },
    {
      title: "Awards & Honors",
      items: [
        {
          points: [
            "Second Prize, University Student Innovation and Entrepreneurship Competition",
            "University-level Outstanding Student Scholarship, Multiple Academic Excellence Awards",
            "Second Prize, National College Student Mathematics Competition",
            "Software Copyright: *Campus Smart Security Monitoring System V1.0*"
          ]
        }
      ]
    },
    {
      title: "Research Interests & Career Plan",
      items: [
        {
          points: [
            "<b>Research Interests</b>: Computer Vision, Natural Language Processing, Multi-modal Learning, Ancient Character Digitization Protection",
            "<b>Graduate Study Plan</b>: Earnestly complete coursework during master's study, actively participate in supervisor's research projects, strive to publish high-quality academic papers, and plan to pursue doctoral degree or engage in AI-related R&D work after graduation",
            "<b>Self-evaluation</b>: Diligent, pragmatic, strong learning ability and team collaboration spirit, full of enthusiasm for scientific research work, able to withstand pressure and complete research tasks"
          ]
        }
      ]
    }
  ]
};

// Render resume
function renderResume(tpl='classic') {
  const el = document.getElementById('resume');
  el.className = 'sheet ' + tpl;
  let html = '';
  
  if(tpl === 'tech') {
    // Tech Blue two-column layout
    html += `<div class="tech-flex"><div class="tech-side">`;
    html += `<h1 class="name" contenteditable="true">${resumeData.name}</h1>`;
    html += `<div class="contact" contenteditable="true">${resumeData.contact}</div>`;
    html += `<div class="apply" contenteditable="true">${resumeData.applyFor}</div>`;
    // Side sections: Education, Skills, Awards
    const sideTitles = ['Education Background', 'Technical Skills', 'Awards & Honors'];
    resumeData.sections.forEach(sec => {
      if(sideTitles.includes(sec.title)) {
        html += `<div class="sec-title" contenteditable="true">${sec.title}</div>`;
        sec.items.forEach(item => {
          if(item.left) html += `<div class="eh-left" contenteditable="true">${item.left}</div>`;
          if(item.tag) html += `<div class="eh-tag" contenteditable="true">${item.tag}</div>`;
          html += `<ul class="points">`;
          item.points.forEach(p => html += `<li contenteditable="true">${p}</li>`);
          html += `</ul>`;
        });
      }
    });
    html += `</div><div class="tech-main">`;
    // Main section: Summary, Research Experience, Plan
    html += `<hr class="head-rule"><p class="summary" contenteditable="true">${resumeData.summary}</p>`;
    resumeData.sections.forEach(sec => {
      if(!sideTitles.includes(sec.title)) {
        html += `<div class="sec-title" contenteditable="true">${sec.title}</div>`;
        sec.items.forEach(item => {
          html += `<div class="exp-head">`;
          if(item.left) html += `<span class="eh-left" contenteditable="true">${item.left}</span>`;
          if(item.tag) html += `<span class="eh-tag" contenteditable="true">${item.tag}</span>`;
          if(item.right) html += `<span class="eh-right" contenteditable="true">${item.right}</span>`;
          html += `</div>`;
          html += `<ul class="points">`;
          item.points.forEach(p => html += `<li contenteditable="true">${p}</li>`);
          html += `</ul>`;
        });
      }
    });
    html += `</div></div>`;
  } else {
    // Classic and Minimal single-column layout
    html += `<h1 class="name" contenteditable="true">${resumeData.name}</h1>`;
    html += `<div class="contact" contenteditable="true">${resumeData.contact}</div>`;
    html += `<div class="apply" contenteditable="true">${resumeData.applyFor}</div>`;
    html += `<hr class="head-rule">`;
    html += `<p class="summary" contenteditable="true">${resumeData.summary}</p>`;
    
    resumeData.sections.forEach(sec => {
      html += `<div class="sec-title" contenteditable="true">${sec.title}</div>`;
      sec.items.forEach(item => {
        html += `<div class="exp-head">`;
        if(item.left) html += `<span class="eh-left" contenteditable="true">${item.left}</span>`;
        if(item.tag) html += `<span class="eh-tag" contenteditable="true">${item.tag}</span>`;
        if(item.right) html += `<span class="eh-right" contenteditable="true">${item.right}</span>`;
        html += `</div>`;
        html += `<ul class="points">`;
        item.points.forEach(p => html += `<li contenteditable="true">${p}</li>`);
        html += `</ul>`;
      });
    });
  }
  
  el.innerHTML = html;
}

// Switch template
function switchTpl(tpl) {
  document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tpl="${tpl}"]`).classList.add('active');
  renderResume(tpl);
}

// Download PDF
function downloadPdf() {
  window.print();
}

// Download Word (using HTML to docx approach)
function downloadDocx() {
  const resumeEl = document.getElementById('resume');
  const htmlContent = `
    <!DOCTYPE html><html><head><meta charset="utf-8">
    <style>
      body{font-family:"Times New Roman",serif;}
      h1.name{font-size:22pt;color:#1B3A5E;text-align:center;font-weight:bold;margin-bottom:8pt;}
      .contact,.apply{text-align:center;font-size:11pt;margin:2pt 0;}
      .contact{color:#666;}
      .apply{color:#1B3A5E;font-weight:bold;}
      .head-rule{border-top:2px solid #1B3A5E;margin:10pt 0;}
      .summary{font-size:11pt;line-height:1.6;text-indent:2em;margin:8pt 0;}
      .sec-title{font-size:13pt;color:#1B3A5E;font-weight:bold;border-bottom:1.5px solid #1B3A5E;padding-bottom:2pt;margin:14pt 0 6pt;}
      .exp-head{margin:6pt 0 2pt;}
      .eh-left{font-weight:bold;font-size:11pt;}
      .eh-tag{color:#5a6a7c;font-size:10pt;margin-left:6pt;}
      .eh-right{float:right;color:#7a8698;font-size:10pt;}
      ul.points{margin:2pt 0 4pt;padding-left:18pt;}
      ul.points li{font-size:11pt;line-height:1.5;margin:2pt 0;}
      b{color:#1B3A5E;}
    </style></head><body>
    ${resumeEl.innerHTML}
    </body></html>
  `;
  const blob = new Blob([htmlContent], {type: 'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Yi_Guo_Graduate_Admission_Resume.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Copy text
function copyText() {
  const resumeEl = document.getElementById('resume');
  const text = resumeEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('Resume text copied to clipboard!');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Resume text copied to clipboard!');
  });
}

// Initial render
renderResume('classic');
</script>
</body>
</html>
